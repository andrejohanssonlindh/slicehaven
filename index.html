<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#1a1420" />
    <title>Slicehaven</title>
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <div id="topbar">
      <span class="logo">SLICEHAVEN</span>
      <span class="tag">engine sandbox</span>
      <span class="spacer"></span>
      <button id="btn-save" type="button">Save</button>
      <a class="btn" href="scene/">Gate</a>
      <a class="btn" href="skills/">Skills</a>
      <a class="btn" href="chargen/">Hero</a>
      <a class="btn" href="artlab/">Art</a>
      <a class="btn" href="director/">Director</a>
    </div>
    <div id="stage">
      <canvas id="view"></canvas>
      <div id="zoom">
        <button type="button" data-zoom="1" aria-label="Zoom in">+</button>
        <button type="button" data-zoom="-1" aria-label="Zoom out">−</button>
        <button type="button" data-zoom="0" aria-label="Fit map">⤢</button>
      </div>
    </div>
    <div id="panel">
      <div id="info"></div>
      <div class="tabs">
        <button type="button" data-tab="act" class="on">Actions</button>
        <button type="button" data-tab="world">World</button>
        <button type="button" data-tab="magic">Magic</button>
      </div>
      <div id="magic-readout" hidden></div>
      <div class="bar" id="bar-act"></div>
      <div class="bar" id="bar-world" hidden></div>
      <div class="bar" id="bar-magic" hidden></div>
    </div>
    <div id="toast" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
