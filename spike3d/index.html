<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#1a1420" />
    <title>Slicehaven · 3D spike</title>
    <link rel="stylesheet" href="/src/ui/style.css" />
    <link rel="stylesheet" href="/src/spike3d/spike3d.css" />
  </head>
  <body>
    <div id="topbar">
      <a class="btn" href="../" aria-label="Back to the sandbox">←</a>
      <span class="logo">SLICEHAVEN</span>
      <span class="tag">3D world <b id="build"></b></span>
      <span class="spacer"></span>
      <a class="btn" href="../village/">Village</a>
      <a class="btn" href="../director/">Director</a>
    </div>
    <div id="stage">
      <canvas id="view"></canvas>
      <pre id="stats"></pre>
      <div id="zoom">
        <button type="button" data-zoom="1" aria-label="Zoom in">+</button>
        <button type="button" data-zoom="-1" aria-label="Zoom out">−</button>
      </div>
      <div id="stairs" hidden>
        <button type="button" data-climb="1" aria-label="Go up the stairs">▲ Up</button>
        <button type="button" data-climb="-1" aria-label="Go down the stairs">▼ Down</button>
      </div>
      <button id="admin-open" type="button" aria-label="Admin menu (å)">⚙</button>
      <div id="radial" hidden></div>
      <div id="notice" hidden></div>
      <div id="loading">Building the world…</div>
    </div>
    <div id="panel" class="folded">
      <div class="row" id="row-time"></div>
      <div class="row" id="row-clock"><input id="hour" type="range" min="0" max="24" step="0.25" value="12" aria-label="Time of day"><span id="hour-text">12:00</span></div>
      <div class="row" id="row-sky"></div>
      <div class="row" id="row-fx"></div>
      <div class="row" id="row-look"></div>
      <div class="row" id="row-magic"></div>
      <div class="row" id="row-perf"></div>
    </div>
    <script type="module" src="/src/spike3d/main.ts"></script>
  </body>
</html>
