name: Deploy to Cloudflare Pages (private site)

# Needs repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# Without them this workflow does nothing, so the GitHub Pages deploy keeps working.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
      - uses: actions/setup-node@v4
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        with:
          node-version: 24
          cache: npm
      - name: Build and deploy
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          npm ci
          npm test
          npm run build
          # The app is built for the /slicehaven/ path, so serve it from that folder.
          mkdir -p site
          mv dist site/slicehaven
          echo '<meta http-equiv="refresh" content="0; url=/slicehaven/">' > site/index.html
          npx wrangler@4 pages deploy site --project-name=slicehaven --branch=main
